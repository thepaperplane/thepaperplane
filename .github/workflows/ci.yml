name: CI

# Every push and every pull request. The audit job is the point of this file:
# typecheck and lint catch what the compiler can see, and the things that
# actually broke on this project — a page rendering invisible, contrast lost
# under a translucent layer, a footer link 404ing — are invisible to both.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npx prettier --check "**/*.{ts,tsx,css,md,json}"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        # The app reads these at build time. Placeholders keep the build
        # honest in CI without putting real credentials in the environment —
        # every data path degrades gracefully when they are absent, which is
        # itself worth exercising.
        env:
          NEXT_PUBLIC_SITE_URL: https://www.thepaperplane.co.in
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 3

  audit:
    name: Accessibility, contrast, link and search audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.thepaperplane.co.in
        run: npm run build

      - name: Serve and audit
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000 --timeout 90000
          npm run audit -- http://localhost:3000
          npm run seo -- http://localhost:3000

      - name: Upload audit log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-failure
          path: |
            .next/trace
          retention-days: 3
          if-no-files-found: ignore
